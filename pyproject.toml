[project]
name = "yoyo-eth"
version = "0.1.0"
description = "Semantic-feature MVP: can OHLCV+MA/ATR features rank MA-compression short candidates without YOLO?"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "lightgbm>=4.0",
    "pyarrow>=10.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# yoyo-eth Semantic MVP configuration.
# Single symbol, single timeframe, one LightGBM regressor (see README).
# Values marked "owner decision" are copied from fable-trading and must not be tuned here.

data:
  # Read-only source: fable-trading OKX kline cache (never written by this project).
  csv_path: /Users/zhangzc/fable-trading/data/kline_fetched/okx_ETH_USDT_SWAP_15m_41281.csv
  symbol: ETH-USDT-SWAP
  timeframe: 15m
  bar_minutes: 15
  # Frozen boundary reused from fable-trading (holdout starts 2026-05-04).
  # This MVP uses bars STRICTLY BEFORE this instant; the holdout period is never read.
  data_end_boundary: "2026-05-04T00:00:00+00:00"

windows:
  local_window: 30      # local behaviour window (bars)
  context_window: 120   # trend background window (bars)

scanner:
  compression_quantile: 0.30   # threshold = this quantile of ma_dispersion_atr on TRAIN bars only
  min_duration: 3              # bars below threshold before a candidate fires
  cooldown_bars: 5             # candidate runs closer than this merge into one event

label:
  horizon_hours: 6
  mae_penalty: 0.7
  # Round-trip cost as fraction of notional, entry+exit combined.
  # Source: fable-trading yoyo/contracts/costs.py SWAP_TAKER = 0.0010
  # (OKX swap taker 0.05%/side incl. slippage allowance). Owner decision, do not tune.
  round_trip_cost: 0.0010
  # Extra costs reported for sensitivity only (LEGACY_P0_ROUND_TRIP = 0.002 is the
  # CLAUDE.md acceptance blanket assumption in the parent project).
  cost_sweep: [0.0010, 0.002]

split:
  # Chronological only; random splits forbidden. Fractions apply to BAR counts
  # within [data start, data_end_boundary). Gap between consecutive splits is
  # max(context_window, horizon_bars) bars, carved from the start of val/test.
  train_frac: 0.70
  val_frac: 0.15

model:
  # Fixed conservative params (doc section 13); no hyperparameter search.
  num_leaves: 15
  max_depth: 5
  learning_rate: 0.03
  n_estimators: 300
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 50

review_charts:
  n_top: 50
  n_random: 50
  n_bottom: 50
  random_seed: 42

paths:
  artifacts_dir: artifacts
  reports_dir: reports

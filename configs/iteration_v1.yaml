# iteration_v1: Correctness Repair + Causal Anchor (owner task book, 2026-08-12).
# Frozen invariants (doc section 3): same data/boundary/windows/horizon/penalty/
# cost/features/model/split for Legacy and Anchored arms. Do not tune here.

data:
  csv_path: /Users/zhangzc/fable-trading/data/kline_fetched/okx_ETH_USDT_SWAP_15m_41281.csv
  symbol: ETH-USDT-SWAP
  timeframe: 15m
  bar_minutes: 15
  data_end_boundary: "2026-05-04T00:00:00+00:00"

windows:
  local_window: 30
  context_window: 120

scanner:
  compression_quantile: 0.30   # frozen; auto-loosening forbidden (doc section 8)
  min_duration: 3
  cooldown_bars: 5             # legacy arm only

anchor:
  exit_confirm_bars: 2
  local_low_window: 10

label:
  horizon_hours: 6
  mae_penalty: 0.7
  round_trip_cost: 0.0010
  cost_sweep: [0.0010, 0.002]

split:
  train_frac: 0.70
  val_frac: 0.15

model:
  num_leaves: 15
  max_depth: 5
  learning_rate: 0.03
  n_estimators: 300
  subsample: 0.8
  subsample_freq: 1            # Stage A 5.4: without this LightGBM never bags rows
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 50

sample_gate:                   # doc section 8; failing -> blocked_by_sample_size
  anchored_train_min: 100
  anchored_val_min: 20
  anchored_test_min: 20

review_charts:
  n_per_set: 20                # N = min(20, group size); val/test only, no train fill
  random_seed: 42

paths:
  artifacts_dir: artifacts/iteration_v1
  reports_dir: reports/iteration_v1
